<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robust Acoustic Modem - Web Audio</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 650px;
      margin: 20px auto;
      padding: 0 15px;
      background-color: #f4f6f9;
      color: #333;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 80px;
      box-sizing: border-box;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status {
      margin-top: 10px;
      padding: 10px;
      background: #eef2f7;
      border-radius: 4px;
      font-family: monospace;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .success { color: #008000; font-weight: bold; }
    .error { color: #cc0000; font-weight: bold; }
    
    /* レベルメーターのスタイル */
    .meter-container {
      margin-top: 10px;
      background: #ddd;
      border-radius: 4px;
      height: 20px;
      width: 100%;
      overflow: hidden;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.1s ease;
    }
  </style>
</head>
<body>

  <h1>🔊 堅牢型音響データモデム (16-MFSK)</h1>
  <p>環境音や反響に強い、確実にデコードできる音響通信システムです。</p>

  <!-- 3. マイク動作テストセクション -->
  <div class="card">
    <h2>3. マイク動作テスト</h2>
    <p>マイクが音を正しく拾えているかリアルタイムで確認します。</p>
    <button id="testMicBtn">マイクテスト開始</button>
    <div class="meter-container">
      <div id="micMeter" class="meter-bar"></div>
    </div>
    <div class="status" id="testStatus">テスト停止中</div>
  </div>

  <!-- 送信セクション -->
  <div class="card">
    <h2>1. 送信 (Speaker)</h2>
    <textarea id="sendText">Hello, Acoustic World!</textarea>
    <button id="sendBtn">音波送信開始</button>
  </div>

  <!-- 受信セクション -->
  <div class="card">
    <h2>2. 受信 (Mic)</h2>
    <button id="listenBtn">マイク受信待機を開始</button>
    <div class="status" id="recvStatus">待機中... 「マイク受信待機を開始」を押してください。</div>
  </div>

  <script>
    // --- 通信パラメータ設定 ---
    const SAMPLE_RATE = 44100;
    const FFT_SIZE = 4096;
    const SYMBOL_DURATION = 0.12;
    const BASE_FREQ = 1500;
    const FREQ_STEP = 100;
    
    const SYNC_TONE_1 = 1000;
    const SYNC_TONE_2 = 3200;

    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || { sampleRate: SAMPLE_RATE })();
      }
      return audioCtx;
    }

    // --- マイクテスト機能 ---
    let isTestingMic = false;

    document.getElementById('testMicBtn').addEventListener('click', async () => {
      const btn = document.getElementById('testMicBtn');
      const statusEl = document.getElementById('testStatus');
      const meterEl = document.getElementById('micMeter');
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') await ctx.resume();

      if (isTestingMic) {
        isTestingMic = false;
        btn.innerText = "マイクテスト開始";
        statusEl.innerText = "テスト停止中";
        meterEl.style.width = "0%";
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        isTestingMic = true;
        btn.innerText = "マイクテスト停止";
        statusEl.innerText = "マイク動作中... 声を出したりスピーカーを鳴らしてバーが動くか確認してください";

        function updateMeter() {
          if (!isTestingMic) return;
          analyser.getByteTimeDomainData(dataArray);

          // 音の振幅（RMS）を計算
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            const v = (dataArray[i] - 128) / 128;
            sum += v * v;
          }
          const rms = Math.sqrt(sum / dataArray.length);
          const percentage = Math.min(100, Math.round(rms * 300)); // スケール調整

          meterEl.style.width = percentage + '%';
          if (percentage > 50) {
            meterEl.style.background = '#ff9800';
          } else {
            meterEl.style.background = '#4caf50';
          }

          requestAnimationFrame(updateMeter);
        }

        updateMeter();

      } catch (err) {
        statusEl.innerText = "マイクアクセスエラー: " + err.message;
      }
    });

    // --- 送信ロジック (16-MFSK) ---
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') await ctx.resume();

      const text = document.getElementById('sendText').value;
      if (!text) return;

      const encoder = new TextEncoder();
      const rawBytes = encoder.encode(text);

      let checksum = 0;
      for (let b of rawBytes) checksum ^= b;

      const packet = new Uint8Array(rawBytes.length + 2);
      packet[0] = rawBytes.length;
      packet.set(rawBytes, 1);
      packet[packet.length - 1] = checksum;

      const nibbles = [];
      for (let b of packet) {
        nibbles.push((b >> 4) & 0x0F);
        nibbles.push(b & 0x0F);
      }

      let time = ctx.currentTime + 0.1;

      playPureTone(ctx, SYNC_TONE_1, time, 0.08);
      time += 0.09;
      playPureTone(ctx, SYNC_TONE_2, time, 0.08);
      time += 0.12;

      for (let nibble of nibbles) {
        const freq = BASE_FREQ + (nibble * FREQ_STEP);
        playPureTone(ctx, freq, time, SYMBOL_DURATION * 0.9);
        time += SYMBOL_DURATION;
      }

      alert("送信が完了しました！");
    });

    function playPureTone(ctx, freq, startTime, duration) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      
      gain.gain.setValueAtTime(0.01, startTime);
      gain.gain.linearRampToValueAtTime(0.2, startTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    // --- 受信ロジック ---
    let isListening = false;

    document.getElementById('listenBtn').addEventListener('click', async () => {
      const statusEl = document.getElementById('recvStatus');
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') await ctx.resume();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = FFT_SIZE;
        analyser.smoothingTimeConstant = 0.1;
        source.connect(analyser);

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Float32Array(bufferLength);

        isListening = true;
        statusEl.innerText = "受信待機中... 音を鳴らしてください";

        let state = 'IDLE';
        let syncTimer = 0;
        let expectedNibbles = 0;
        let receivedNibbles = [];
        let nextSymbolTime = 0;

        function getFrequencyPower(targetFreq) {
          const nyquist = ctx.sampleRate / 2;
          const binIndex = Math.round((targetFreq / nyquist) * (bufferLength));
          return dataArray[binIndex] || 0;
        }

        function analyze() {
          if (!isListening) return;
          analyser.getFloatFrequencyData(dataArray);

          const now = performance.now();

          if (state === 'IDLE') {
            const p1 = getFrequencyPower(SYNC_TONE_1);
            if (p1 > -35) {
              state = 'SYNCING_2';
              syncTimer = now + 120;
            }
          } else if (state === 'SYNCING_2') {
            const p2 = getFrequencyPower(SYNC_TONE_2);
            if (p2 > -35) {
              state = 'RECEIVING';
              receivedNibbles = [];
              nextSymbolTime = performance.now() + (SYMBOL_DURATION * 1000) * 1.5;
              statusEl.innerText = "同期成功！データ受信中...";
            } else if (now > syncTimer) {
              state = 'IDLE';
            }
          } else if (state === 'RECEIVING') {
            if (now >= nextSymbolTime) {
              let bestNibble = 0;
              let maxPower = -999;

              for (let i = 0; i < 16; i++) {
                const freq = BASE_FREQ + (i * FREQ_STEP);
                const power = getFrequencyPower(freq);
                if (power > maxPower) {
                  maxPower = power;
                  bestNibble = i;
                }
              }

              receivedNibbles.push(bestNibble);

              if (receivedNibbles.length === 2) {
                const lengthNibbleHi = receivedNibbles[0];
                const lengthNibbleLo = receivedNibbles[1];
                const dataLen = (lengthNibbleHi << 4) | lengthNibbleLo;
                expectedNibbles = (dataLen + 2) * 2;
              }

              statusEl.innerText = `受信中... (${receivedNibbles.length} / ${expectedNibbles || '?'})`;

              if (expectedNibbles > 0 && receivedNibbles.length >= expectedNibbles) {
                state = 'IDLE';
                processReceivedData(receivedNibbles, statusEl);
              } else {
                nextSymbolTime += SYMBOL_DURATION * 1000;
              }
            }
          }

          requestAnimationFrame(analyze);
        }

        analyze();

      } catch (err) {
        statusEl.innerText = "マイクアクセスエラー: " + err.message;
      }
    });

    function processReceivedData(nibbles, statusEl) {
      const bytes = new Uint8Array(nibbles.length / 2);
      for (let i = 0; i < bytes.length; i++) {
        bytes[i] = (nibbles[i * 2] << 4) | nibbles[i * 2 + 1];
      }

      const dataLen = bytes[0];
      const actualData = bytes.slice(1, 1 + dataLen);
      const receivedChecksum = bytes[bytes.length - 1];

      let calcChecksum = 0;
      for (let b of actualData) calcChecksum ^= b;

      if (calcChecksum === receivedChecksum) {
        const decoder = new TextDecoder();
        const text = decoder.decode(actualData);
        statusEl.innerHTML = `<span class="success">【受信・検証成功】</span>\n${text}`;
      } else {
        statusEl.innerHTML = `<span class="error">【エラー】チェックサム不一致（ノイズの可能性があります）</span>`;
      }
    }
  </script>
</body>
</html>
